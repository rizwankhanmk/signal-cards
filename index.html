<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signal Cards</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; color: #1d1d1f; }
  table { border-collapse: collapse; width: 100%; margin: 1rem 0; }
  th, td { text-align: left; padding: .4rem .6rem; border-bottom: 1px solid #ddd; vertical-align: top; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .label { font-size: 1.4rem; margin: 1rem 0; }
  .muted { color: #6e6e73; font-size: .9rem; }
</style>
</head>
<body>
<h1 id="title">Loading…</h1>
<div id="card"></div>
<p class="muted">Educational, not financial advice.</p>
<script>
  const q = new URLSearchParams(location.search);
  const ticker = (q.get("ticker") || "WDFC").toUpperCase();
  const fmtK = usd => (usd / 1000).toLocaleString("en-US"); // the 10-K shows USD thousands

  fetch(`data/${ticker}.json`).then(r => r.json()).then(d => {
    const [thisFy, lastFy] = [d.rows[0].this_year.fy, d.rows[0].last_year.fy];
    document.getElementById("title").textContent = `${d.signal} · ${d.company} · ${thisFy} vs ${lastFy}`;
    const rows = d.rows.map(r => `
      <tr>
        <td>${r.item}</td>
        <td class="num">${fmtK(r.this_year.usd)}</td>
        <td class="num">${fmtK(r.last_year.usd)}</td>
        <td>${r.formula}</td>
        <td><a href="${r.this_year.url}" target="_blank" rel="noopener">${r.statement}</a></td>
      </tr>`).join("");
    document.getElementById("card").innerHTML = `
      <p class="muted">USD thousands, as shown in the 10-K. Fiscal years end ${d.rows[0].this_year.end.slice(5)}.</p>
      <table>
        <tr><th>Item</th><th>${thisFy}</th><th>${lastFy}</th><th>Formula and result</th><th>Source</th></tr>
        ${rows}
      </table>
      <p class="label"><strong>${d.label.name}.</strong> ${d.label.reason}</p>
      <p class="muted">${d.status}. Tick when you have checked the numbers in the filing.
        Numbers pulled from the SEC on ${d.fetched_at.slice(0, 10)}.</p>`;
  }).catch(e => { document.getElementById("title").textContent = `No data for ${ticker}. Run: npm run fetch`; });
</script>
</body>
</html>
