<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signal Cards</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 820px; margin: 2rem auto; padding: 0 1rem; color: #1d1d1f; }
  form { display: flex; gap: .5rem; margin-bottom: 1.5rem; }
  input, button { font: inherit; padding: .5rem .75rem; border: 1px solid #999; border-radius: 6px; }
  input { width: 9rem; text-transform: uppercase; }
  button { background: #1d1d1f; color: #fff; border-color: #1d1d1f; cursor: pointer; }
  h2 { margin: 2.5rem 0 0; padding-top: 1.5rem; border-top: 1px solid #ddd; }
  .scroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; margin: 1rem 0; }
  th, td { text-align: left; padding: .4rem .6rem; border-bottom: 1px solid #ddd; vertical-align: top; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .label { font-size: 1.25rem; margin: 1rem 0; }
  .muted { color: #6e6e73; font-size: .9rem; }
</style>
</head>
<body>
<form id="form">
  <label for="ticker" class="muted" style="align-self:center">US ticker</label>
  <input id="ticker" name="ticker" placeholder="WDFC" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="10" required>
  <button>Show cards</button>
</form>
<h1 id="title"></h1>
<p class="muted" id="sub"></p>
<div id="cards"></div>
<p class="muted">Educational, not financial advice.</p>
<script>
  const $ = id => document.getElementById(id);
  // Text from the data is shown as text, never as page code.
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  async function show(ticker) {
    $("ticker").value = ticker;
    $("title").textContent = `Reading ${ticker}…`;
    $("sub").textContent = ""; $("cards").innerHTML = "";
    let d;
    try {
      const r = await fetch(`/api/cards?ticker=${encodeURIComponent(ticker)}`);
      d = await r.json();
      if (!r.ok) throw new Error(d.error);
    } catch (e) {
      $("title").textContent = "No cards";
      $("sub").textContent = e.message || "Something went wrong. Is the server still running in the Terminal?";
      return;
    }
    const T = d.fiscal.this_year, L = d.fiscal.last_year;
    document.title = `${d.ticker} · Signal Cards`;
    $("title").textContent = `${d.company} (${d.ticker}) · ${T.fy} vs ${L.fy}`;
    $("sub").innerHTML =
      `${esc(d.unit)}, as shown in the 10-K. Fiscal year ${esc(T.fy)} ended ${esc(T.end)}. ` +
      (d.industry ? `SEC industry: ${esc(d.industry)}. ` : "") +
      `Numbers pulled from the SEC on ${esc(d.fetched_at.slice(0, 10))}. ` +
      `<a href="${esc(d.filing.url)}" target="_blank" rel="noopener">10-K filed ${esc(d.filing.filed)}</a>.`;

    $("cards").innerHTML = d.cards.map((c, n) => {
      const rows = c.rows.map(r => `
        <tr>
          <td>${esc(r.item)}</td>
          <td class="num">${esc(r.this_year)}</td>
          <td class="num">${esc(r.last_year)}</td>
          <td>${r.formula.map(esc).join("<br>")}</td>
          <td>${r.url ? `<a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.statement)}</a>` : esc(r.statement)}</td>
        </tr>`).join("");
      const table = c.rows.length ? `
        <div class="scroll"><table>
          <tr><th>Item</th><th>${esc(T.fy)}</th><th>${esc(L.fy)}</th><th>Formula and result</th><th>Source</th></tr>
          ${rows}
        </table></div>` : "";
      const label = c.label
        ? `<p class="label"><strong>${esc(c.label.name)}.</strong> ${esc(c.label.reason)}</p>`
        : `<p class="label"><strong>${esc(c.state)}.</strong> ${esc(c.note)}</p>`;
      const draft = c.rows.length ? `<p class="muted">${esc(c.status)}. Tick when you have checked the numbers in the filing.</p>` : "";
      return `<section><h2>${n + 1}. ${esc(c.signal)}</h2>${table}${label}${draft}</section>`;
    }).join("");
  }

  $("form").addEventListener("submit", e => {
    e.preventDefault();
    const t = $("ticker").value.trim().toUpperCase();
    if (!t) return;
    history.pushState(null, "", `?ticker=${encodeURIComponent(t)}`);
    show(t);
  });
  const fromUrl = () => show((new URLSearchParams(location.search).get("ticker") || "WDFC").toUpperCase());
  addEventListener("popstate", fromUrl);
  fromUrl();
</script>
</body>
</html>
