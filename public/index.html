<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Signal Cards</title>
<meta name="description" content="Type a company. Read its annual report one card at a time: eight signals, plus cash and debt. Guess the flag before each card flips. Educational, not financial advice.">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1d1d1f" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-title" content="Signal Cards">
<meta property="og:title" content="Signal Cards">
<meta property="og:description" content="Read any US company's annual report one card at a time. Guess the flag before each card flips.">
<meta property="og:type" content="website">
<meta property="og:image" content="https://signal-cards.vercel.app/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Three greys, light and dark. The fun is in the words, never in clutter. */
  /* Plus three quiet colours for the labels: good, watch, warning. Always paired with a shape. */
  :root { --bg: #ffffff; --surface: #f5f5f7; --text: #1d1d1f; --muted: #6e6e73; --good: #2f9e6e; --watch: #c58a12; --warn: #d24b3e; color-scheme: light; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #1d1d1f; --surface: #2a2a2d; --text: #f5f5f7; --muted: #a1a1a6; --good: #57c990; --watch: #e6b24a; --warn: #f0776c; color-scheme: dark; }
  }
  :root[data-theme="dark"] { --bg: #1d1d1f; --surface: #2a2a2d; --text: #f5f5f7; --muted: #a1a1a6; --good: #57c990; --watch: #e6b24a; --warn: #f0776c; color-scheme: dark; }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font-family: Inter, system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
         font-size: 17px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 0 20px; overflow-x: clip; } /* clip: a card sliding in must never widen the page */
  a { color: inherit; }
  button { font: inherit; color: inherit; }
  button, a, summary, label { -webkit-tap-highlight-color: transparent; } /* no blue flash on tap */
  :focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }
  .muted { color: var(--muted); }
  .hair { border: 0; border-top: 1px solid color-mix(in srgb, var(--text) 12%, transparent); }

  /* Top bar */
  /* The bar stays at the top as you scroll, so Home and All eight are always one tap away */
  .bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 0; font-size: 14px;
         position: sticky; top: 0; z-index: 6; background: var(--bg); }
  .barnav { display: flex; align-items: center; gap: 8px; }
  .pill { background: var(--surface); border: 0; border-radius: 999px; padding: 0 16px; min-height: 40px; font-size: 14px; font-weight: 500; cursor: pointer; white-space: nowrap; position: relative; }
  .pill::after { content: ""; position: absolute; inset: -2px 0; } /* a 44-point area to tap */
  .pill:hover { outline: 1px solid var(--text); }
  .barnav .ghost { margin-left: 6px; }
  .brand { white-space: nowrap; }
  @media (max-width: 370px) { .pill { padding: 0 11px; font-size: 13px; } .barnav { gap: 5px; } .barnav .ghost { margin-left: 2px; font-size: 13px; } .bar { gap: 6px; } }
  .brand { font-weight: 600; text-decoration: none; letter-spacing: -.01em; display: inline-flex; align-items: center; min-height: 44px; }
  .ghost { background: none; border: 0; padding: 6px 0; min-height: 44px; cursor: pointer; color: var(--muted); font-size: 14px; }
  .ghost:hover { color: var(--text); }
  /* Icon buttons in the top bar: settings, and light or dark */
  .iconbtn { display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; padding: 0; border: 0; border-radius: 50%;
             background: none; color: var(--muted); cursor: pointer; }
  .iconbtn:hover, .iconbtn[aria-expanded="true"] { color: var(--text); background: var(--surface); }
  .iconbtn svg { width: 22px; height: 22px; }
  .barnav .iconbtn + .iconbtn { margin-left: -6px; }

  /* The first-visit explainer */
  .intro { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center; padding: 20px;
           background: color-mix(in srgb, var(--bg) 70%, transparent); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
  .intro-card { width: min(400px, 100%); padding: 28px 26px 22px; border-radius: 26px; text-align: center; background: var(--bg);
                border: 1px solid color-mix(in srgb, var(--text) 12%, transparent); box-shadow: 0 24px 60px color-mix(in srgb, #000 22%, transparent); }
  .intro-step { margin: 0 0 14px; font-size: 12px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
  .intro-card h2 { margin: 0 0 10px; font-size: 30px; font-weight: 700; letter-spacing: -.03em; line-height: 1.1; }
  .intro-text { margin: 0 auto; max-width: 30ch; font-size: 17px; color: var(--muted); text-wrap: balance; }
  .intro-art { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; min-height: 132px; margin: 20px 0 18px; padding: 16px;
               border-radius: 18px; background: var(--surface); }
  .art-pill { padding: 10px 26px; border-radius: 999px; background: var(--bg); font-size: 17px; font-weight: 500; }
  .art-go { padding: 8px 20px; border-radius: 999px; background: var(--text); color: var(--bg); font-size: 15px; font-weight: 500; }
  .art-num { font-size: 40px; font-weight: 700; letter-spacing: -.035em; line-height: 1; }
  .art-vs { font-size: 13px; color: var(--muted); }
  .art-row { display: flex; gap: 6px 14px; flex-wrap: wrap; justify-content: center; align-items: center; font-size: 15px; font-weight: 500; }
  .art-row .mark { margin-right: -8px; }
  .art-link { font-size: 30px; font-weight: 600; letter-spacing: -.02em; text-decoration: underline dotted; text-underline-offset: 6px; }
  .intro-actions { display: flex; justify-content: space-between; align-items: center; }
  .intro-actions .go { min-width: 110px; }

  /* Placeholder tiles while a company loads */
  .tile.skel { cursor: default; background: linear-gradient(100deg, var(--surface) 30%, color-mix(in srgb, var(--surface) 55%, var(--bg)) 50%, var(--surface) 70%) 0 0 / 300% 100%; animation: shimmer 1.3s linear infinite; }
  .tile.skel:hover { transform: none; }
  @keyframes shimmer { from { background-position: 100% 0; } to { background-position: -100% 0; } }
  @media (prefers-reduced-motion: reduce) { .tile.skel { animation: none; } }

  /* Search box */
  .ask { text-align: center; padding: 9vh 0 6vh; }
  .ask.small { padding: 3vh 0 4vh; }
  .motto { font-size: clamp(30px, 6vw, 56px); font-weight: 700; letter-spacing: -.035em; line-height: 1.06; margin: 0 0 14px; text-wrap: balance; }
  .ask.small .motto, .ask.small .lede, .ask.small .tries { display: none; }
  .tries.after { margin: 26px 0 0; }
  /* A heading between groups of tiles, and the plain reading under a ratio table */
  .deckhead { grid-column: 1 / -1; font-size: 13px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; margin: 22px 0 2px; }
  .cmp .deckhead { margin: 44px 0 0; padding-top: 22px; border-top: 1px solid color-mix(in srgb, var(--text) 12%, transparent); color: var(--muted); }
  .reading { font-size: 17px; font-weight: 500; margin: 14px 0 0; }
  /* Proof that stays folded until you want it: one tappable row per section */
  .folds { border-top: 1px solid color-mix(in srgb, var(--text) 12%, transparent); margin-top: 8px; }
  .fold { border-bottom: 1px solid color-mix(in srgb, var(--text) 12%, transparent); }
  .fold summary { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 56px; cursor: pointer; list-style: none;
                  font-size: 14px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; }
  .fold summary::-webkit-details-marker { display: none; }
  .fold summary::after { content: ""; width: 9px; height: 9px; flex: none; margin-right: 4px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted);
                         transform: rotate(45deg) translate(-2px, -2px); transition: transform .15s ease; }
  .fold[open] summary::after { transform: rotate(-135deg) translate(-2px, -2px); }
  .fold-body { padding: 0 0 22px; }
  .fold-body table { margin-top: 0; }
  table.rules tr.hit td { font-weight: 600; background: var(--surface); }
  table.rules td, table.rules th { padding-left: 10px; }
  .thisone { display: inline-block; margin-left: 6px; padding: 1px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; background: var(--text); color: var(--bg); }
  /* Progress dots at the top of a card */
  .dots { display: flex; justify-content: center; align-items: center; flex-wrap: wrap; margin: 0 0 2px; }
  .dot { position: relative; width: 22px; height: 30px; padding: 0; border: 0; background: none; cursor: pointer; }
  .dot::before { content: ""; position: absolute; left: 50%; top: 50%; width: 9px; height: 9px; margin: -4.5px 0 0 -4.5px; border-radius: 50%;
                 box-sizing: border-box; border: 1.5px solid var(--muted); }
  .dot.none::before { background: var(--muted); opacity: .45; }
  .dot.good::before { background: var(--good); border-color: var(--good); }
  .dot.watch::before { background: var(--watch); border-color: var(--watch); }
  .dot.warn::before { background: var(--warn); border-color: var(--warn); }
  .dot.here::before { width: 13px; height: 13px; margin: -6.5px 0 0 -6.5px; box-shadow: 0 0 0 3px var(--bg), 0 0 0 4.5px var(--text); }
  .dotgap { width: 12px; }
  @media (max-width: 370px) { .dot { width: 19px; } .dotgap { width: 8px; } }
  /* The quiet line for cards with nothing to show */
  .quiet { grid-column: 1 / -1; font-size: 13px; color: var(--muted); margin: 2px 0 0; }
  .linkish { background: none; border: 0; padding: 6px 0; font: inherit; color: inherit; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
  .cp-tries { margin-top: 10px; }
  /* The checkpoint between two groups of cards */
  .cp-title { font-size: clamp(34px, 7vw, 56px); font-weight: 700; letter-spacing: -.035em; line-height: 1.06; margin: 0; text-wrap: balance; }
  .cp-score { font-size: clamp(21px, 3.4vw, 28px); font-weight: 600; letter-spacing: -.02em; margin: 22px 0 0; }
  .cp-tally { display: flex; gap: 6px 22px; justify-content: center; flex-wrap: wrap; font-size: 16px; color: var(--muted); margin: 16px 0 0; }
  .cp-next { font-size: 17px; max-width: 40ch; margin: 44px auto 0; text-wrap: balance; }
  .cp-next small { display: block; font-size: 12px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
  .cp-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin: 30px 0 0; }
  .cp-actions .pill { min-height: 48px; padding: 0 20px; font-size: 16px; display: inline-flex; align-items: center; }
  .lede { font-size: 19px; color: var(--muted); margin: 0 0 34px; }
  form { display: flex; gap: 8px; justify-content: center; }
  .box { position: relative; width: min(21rem, 100%); }
  input { font: inherit; font-size: 18px; font-weight: 500; width: 100%; padding: 12px 20px; color: var(--text);
          background: var(--surface); border: 1px solid transparent; border-radius: 999px; }
  input::placeholder { color: var(--muted); opacity: .8; font-weight: 400; }
  input:focus { outline: none; border-color: var(--text); }
  .go { font-size: 17px; font-weight: 500; padding: 12px 22px; border-radius: 999px; border: 0; cursor: pointer; background: var(--text); color: var(--bg); }
  .hits { position: absolute; z-index: 5; left: 0; right: 0; top: calc(100% + 6px); margin: 0; padding: 6px; list-style: none; text-align: left;
          background: var(--bg); border: 1px solid color-mix(in srgb, var(--text) 14%, transparent); border-radius: 18px;
          box-shadow: 0 12px 32px color-mix(in srgb, #000 16%, transparent); }
  .hits li { display: flex; justify-content: space-between; gap: 12px; align-items: center; padding: 9px 14px; min-height: 44px; border-radius: 12px; cursor: pointer; font-size: 16px; }
  .hits li[aria-selected="true"], .hits li:hover { background: var(--surface); }
  .hits .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hits .aka { color: var(--muted); font-size: 14px; margin-left: .35em; }
  .hits .t { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
  .tries { margin: 22px 0 0; font-size: 15px; color: var(--muted); display: flex; gap: 8px; justify-content: center; align-items: center; flex-wrap: wrap; }
  .chip { background: none; border: 1px solid color-mix(in srgb, var(--text) 18%, transparent); border-radius: 999px; padding: 6px 16px; min-height: 44px; cursor: pointer; font-size: 15px; }
  button.chip:hover { background: var(--surface); }
  .tries .when { color: var(--muted); font-size: 13px; margin-left: .35em; }
  #picks { display: contents; }
  .shuffle { font-size: 15px; padding: 6px 8px; }
  .soonline { margin: 14px 0 0; font-size: 13px; color: var(--muted); }
  .ask.small .soonline { display: none; }

  /* Company heading */
  .head { text-align: center; padding: 0 0 36px; }
  .head h1 { font-size: clamp(26px, 4.6vw, 40px); font-weight: 700; letter-spacing: -.03em; line-height: 1.1; margin: 0 0 8px; text-wrap: balance; }
  .head p { margin: 0; font-size: 15px; }
  .head .headnote { max-width: 46ch; margin: 18px auto 0; padding: 12px 18px; border-radius: 16px; background: var(--surface); text-wrap: balance; }

  /* The small mark beside a label: hollow = good, half = watch, filled = warning. Shape, not colour. */
  .mark { display: inline-block; width: .62em; height: .62em; border-radius: 50%; border: 1.5px solid currentColor; margin-right: .5em; vertical-align: .02em; }
  .mark.good { color: var(--good); } .mark.watch { color: var(--watch); } .mark.warn { color: var(--warn); }
  .tile.tone-good { background: color-mix(in srgb, var(--good) 9%, var(--surface)); }
  .tile.tone-watch { background: color-mix(in srgb, var(--watch) 9%, var(--surface)); }
  .tile.tone-warn { background: color-mix(in srgb, var(--warn) 9%, var(--surface)); }
  .mark.watch { background: linear-gradient(90deg, currentColor 50%, transparent 50%); }
  .mark.warn { background: currentColor; }

  /* Eight tiles */
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  @media (max-width: 699px) { .grid { grid-template-columns: repeat(2, 1fr); } }
  @media (min-width: 700px) and (max-width: 900px) { .grid .tile { padding: 16px; } }
  .tile { display: flex; flex-direction: column; text-align: left; min-height: 196px; padding: 20px; background: var(--surface);
          border: 0; border-radius: 20px; cursor: pointer; transition: transform .15s ease; container-type: inline-size; }
  .tile:hover { transform: translateY(-2px); }
  .t-name { font-size: 14px; font-weight: 500; color: var(--muted); }
  .t-big { font-size: clamp(30px, 4.4vw, 42px); font-size: clamp(20px, 23cqw, 42px); /* sized to the tile, so it never spills */ font-weight: 700; letter-spacing: -.035em; line-height: 1; margin-top: auto; font-variant-numeric: tabular-nums; }
  .t-big.long { font-size: clamp(18px, 17cqw, 42px); } /* a rare very long number, like +1154.3% */
  .t-small { font-size: 13px; color: var(--muted); margin-top: 6px; min-height: 1.45em; }
  .t-label { font-size: 15px; font-weight: 600; margin-top: 14px; }
  .tile.empty .t-big, .tile.empty .t-label { color: var(--muted); }
  .key { text-align: center; font-size: 13px; color: var(--muted); margin: 26px 0 0; }
  .key span { white-space: nowrap; margin: 0 .7em; }
  @media (max-width: 420px) { .tile { min-height: 168px; padding: 16px; border-radius: 16px; } .grid { gap: 10px; } }
  @media (max-width: 699px), (min-width: 700px) and (max-width: 900px) {
    .grid .t-top { min-height: 2.9em; align-items: flex-start; }
    .grid .t-big { margin-top: 10px; }
    .grid .t-small { min-height: 2.9em; }
    .grid .t-label { margin-top: 6px; }
  }
  .t-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .badge { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .t-result { font-size: 12px; color: var(--muted); margin-top: 3px; min-height: 1.3em; }
  .tile.down { outline: 1px dashed color-mix(in srgb, var(--text) 28%, transparent); outline-offset: -1px; background: none; }
  .tile.down .t-label { color: var(--muted); font-weight: 500; }

  /* Catch the flag: the score line, the guess buttons, the flip */
  .score { display: flex; gap: 6px 16px; justify-content: center; align-items: baseline; flex-wrap: wrap; font-size: 15px; margin: -14px 0 26px; }
  .score b { font-weight: 600; }
  .ask-flag { font-size: clamp(21px, 3.4vw, 28px); font-weight: 600; letter-spacing: -.02em; margin: 44px 0 18px; }
  .guess { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .guess button { font-size: 17px; font-weight: 500; padding: 12px 24px; border-radius: 999px; cursor: pointer; background: var(--surface); border: 1px solid transparent; }
  .guess button:hover { border-color: var(--text); }
  .guess button { transition: transform .12s ease, background .2s ease, color .2s ease, opacity .2s ease; }
  .guess button:active { transform: scale(.96); }
  /* Your pick lights up for a beat before the card turns */
  .guess.chosen button { opacity: .3; pointer-events: none; }
  .guess.chosen button.picked { opacity: 1; background: var(--text); color: var(--bg); transform: scale(1.05); }
  .verdict { font-size: 15px; color: var(--muted); margin: 0 0 6px; }
  /* The reveal, in order: the answer turns over like a card, the verdict and the line follow,
     then the reader's line, then the numbers. A catch pops the mark; a miss gives a small shake. */
  @keyframes turn { from { transform: perspective(900px) rotateX(-86deg); opacity: 0; } 55% { opacity: 1; } to { transform: perspective(900px) rotateX(0); opacity: 1; } }
  @keyframes rise { from { transform: translateY(14px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes pop { 0% { transform: scale(0); } 65% { transform: scale(1.7); } 100% { transform: scale(1); } }
  @keyframes shake { 0%, 100% { transform: none; } 20% { transform: translateX(-7px); } 50% { transform: translateX(6px); } 80% { transform: translateX(-3px); } }
  @keyframes tileflip { from { transform: perspective(700px) rotateY(-88deg); opacity: .15; } to { transform: perspective(700px) rotateY(0); opacity: 1; } }
  .fresh .reveal { animation: turn .6s cubic-bezier(.2, .8, .3, 1.12) both; transform-origin: 50% 0; }
  .fresh .reveal .verdict { animation: rise .45s ease .3s both; }
  .fresh .reveal .line { animation: rise .5s ease .42s both; }
  .fresh .reveal .next { animation: rise .5s ease .62s both; }
  .fresh .hair, .fresh .proof { animation: rise .55s ease .85s both; }
  .fresh .proof + .proof { animation-delay: 1s; }
  .fresh .reveal.hit .name .mark { animation: pop .5s ease .55s both; }
  .fresh .reveal.miss .name { animation: shake .4s ease .6s both; }
  .tile.flipped { animation: tileflip .55s cubic-bezier(.2, .8, .3, 1.1) both; }
  @media (prefers-reduced-motion: reduce) {
    .tile.flipped, .fresh .reveal, .fresh .reveal *, .fresh .hair, .fresh .proof { animation: none !important; }
    .tile, .guess button { transition: none; }
  }
  .tick { display: flex; gap: 10px; align-items: center; font-size: 15px; margin: 8px 0 0; padding: 10px 0; min-height: 44px; cursor: pointer; width: fit-content; }
  .tick input { width: 18px; height: 18px; margin: 0; padding: 0; accent-color: var(--text); border-radius: 4px; }

  /* One card, one screen */
  .nav { text-align: center; font-size: 14px; padding: 8px 0 0; }
  .hero { text-align: center; padding: 7vh 0 6vh; }
  .hero .kicker { font-size: 15px; color: var(--muted); margin: 0 0 22px; }
  .hero .big { font-size: clamp(64px, 17vw, 152px); font-weight: 700; letter-spacing: -.055em; line-height: .95; margin: 0; font-variant-numeric: tabular-nums; }
  .hero .under { font-size: 17px; color: var(--muted); margin: 14px 0 0; }
  .hero .name { font-size: 14px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; margin: 0 0 12px; }
  .hero .reveal { margin-top: 44px; }
  .hero .line { font-size: clamp(21px, 3.4vw, 28px); font-weight: 600; letter-spacing: -.02em; line-height: 1.25; max-width: 30ch; margin: 0 auto; text-wrap: balance; }
  .hero .line.plain { font-weight: 400; font-size: 19px; color: var(--muted); max-width: 44ch; letter-spacing: 0; }
  .hero .what { font-size: 15px; color: var(--muted); max-width: 52ch; margin: 30px auto 0; text-wrap: pretty; }

  .proof { padding: 28px 0 0; }
  .proof + .proof { padding-top: 44px; }
  .proof h2 { font-size: 14px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; margin: 0 0 4px; }
  .scroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 15px; margin-top: 8px; }
  th { font-weight: 500; color: var(--muted); font-size: 13px; }
  th, td { text-align: left; padding: 12px 14px 12px 0; vertical-align: top; border-bottom: 1px solid color-mix(in srgb, var(--text) 12%, transparent); }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  td.f { font-variant-numeric: tabular-nums; white-space: nowrap; }
  td.lab { white-space: nowrap; }
  .note { font-size: 14px; margin: 18px 0 0; }
  a.chk { text-decoration: underline; text-decoration-style: dotted; text-underline-offset: 4px; text-decoration-color: var(--muted); }
  a.chk:hover { text-decoration-style: solid; text-decoration-color: currentColor; }
  /* Moving between cards: the new card slides in from the side you are heading to */
  @keyframes fromRight { from { transform: translateX(36px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes fromLeft { from { transform: translateX(-36px); opacity: 0; } to { transform: none; opacity: 1; } }
  #detail.slide-next { animation: fromRight .28s ease both; }
  #detail.slide-prev { animation: fromLeft .28s ease both; }
  .swipe-hint { display: none; text-align: center; font-size: 14px; color: var(--muted); margin: 6px 0 0; }
  @media (hover: none) and (pointer: coarse) { .swipe-hint { display: block; } }
  @media (prefers-reduced-motion: reduce) { #detail.slide-next, #detail.slide-prev { animation: none; } }
  .steps { display: flex; justify-content: space-between; gap: 16px; padding: 44px 0 0; font-size: 15px; }
  .steps button { background: none; border: 0; padding: 6px 0; cursor: pointer; text-align: left; }
  .steps button:last-child { text-align: right; margin-left: auto; }
  .steps small { display: block; color: var(--muted); font-size: 12px; }

  /* The two switches */
  /* The settings panel drops down from the button in the top bar */
  .switches { position: absolute; right: 0; top: calc(100% + 2px); z-index: 8; display: flex; flex-direction: column; align-items: flex-start; gap: 8px;
              width: min(300px, calc(100vw - 40px)); padding: 16px 16px 10px; border-radius: 20px; background: var(--bg);
              border: 1px solid color-mix(in srgb, var(--text) 14%, transparent); box-shadow: 0 16px 40px color-mix(in srgb, #000 18%, transparent); }
  .set-title { margin: 6px 0 0; font-size: 12px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
  .set-title:first-child { margin-top: 0; }
  .switches .linkish { margin-top: 4px; font-size: 14px; color: var(--muted); }
  .headbtns { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin: 14px 0 0 !important; }
  .seg { display: inline-flex; padding: 3px; border-radius: 999px; background: var(--surface); }
  .seg button { position: relative; border: 0; background: none; padding: 10px 16px; border-radius: 999px; font-size: 13px; font-weight: 500; color: var(--muted); cursor: pointer; }
  .seg button::after { content: ""; position: absolute; inset: -4px 0; } /* a taller area to tap */
  .seg button[aria-pressed="true"] { background: var(--bg); color: var(--text); box-shadow: 0 1px 3px color-mix(in srgb, #000 14%, transparent); }
  .hero .cap { font-size: 14px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; margin: -6px 0 10px; }
  .hero .why { font-size: 16px; max-width: 40ch; margin: 22px auto 0; padding: 12px 16px; border-radius: 14px; background: var(--surface); text-wrap: balance; }
  .hero .why small { display: block; font-size: 12px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
  .unit { font-size: 13px; margin: 0 0 6px; }
  /* On a phone, a table row stacks: the item and its two numbers on one line, the formula below it. */
  @media (max-width: 699px) {
    table.stack, table.stack tbody { display: block; }
    table.stack tr { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; column-gap: 16px; align-items: baseline; padding: 10px 0;
                     border-bottom: 1px solid color-mix(in srgb, var(--text) 12%, transparent); }
    table.stack th, table.stack td { border: 0; padding: 0; }
    table.stack th:nth-child(n+4) { display: none; }
    table.stack td.f { grid-column: 1 / -1; white-space: normal; font-size: 14px; color: var(--muted); padding-top: 6px; overflow-wrap: anywhere; }
    table.stack td.f:empty { display: none; }
    table.stack td.src { grid-column: 1 / -1; font-size: 13px; padding-top: 4px; }
    table.stack td.num { min-width: 4.2em; }
    /* The other tables (the trend, the rules) stay as tables but tighten up so they fit the screen */
    .fold-body table:not(.stack) { font-size: 14px; }
    .fold-body table:not(.stack) th, .fold-body table:not(.stack) td { padding-right: 8px; }
    .fold-body table:not(.stack) th { white-space: normal; font-size: 12px; }
    .fold-body td.lab { white-space: normal; }
  }
  .hero .next { font-size: 17px; max-width: 40ch; margin: 30px auto 0; text-wrap: balance; }
  .hero .next small { display: block; font-size: 12px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }

  /* Compare two companies */
  .vs { display: flex; gap: 10px; justify-content: center; align-items: center; flex-wrap: wrap; margin: -18px 0 26px; font-size: 15px; color: var(--muted); }
  .vs .box { width: min(17rem, 100%); }
  .vs input { font-size: 16px; padding: 9px 16px; }
  .cmp-head, .cmp-two { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .cmp-head { position: sticky; top: 60px; z-index: 2; background: var(--bg); padding: 10px 0 12px; }
  .cmp-head b { display: block; font-size: 17px; font-weight: 600; letter-spacing: -.01em; }
  .cmp-head span { font-size: 13px; color: var(--muted); }
  .cmp-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; padding: 12px 0; border-top: 1px solid color-mix(in srgb, var(--text) 10%, transparent); }
  .cmp-row h3 { grid-column: 1 / -1; font-size: 12px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; }
  .cmp-cell { display: grid; grid-template-columns: auto 1fr; align-items: baseline; gap: 0 10px; text-align: left; font: inherit; color: inherit; background: none; border: 0; border-radius: 12px; padding: 6px 8px; margin: 0 -8px; cursor: pointer; min-height: 44px; }
  .cmp-cell:hover { background: var(--surface); }
  .cmp-cell .c-big { font-size: 22px; font-weight: 600; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .cmp-cell .c-label { font-size: 14px; font-weight: 600; white-space: nowrap; }
  .cmp-cell .c-small { grid-column: 1 / -1; font-size: 12px; color: var(--muted); }
  .cmp-cell.down .c-label, .cmp-cell.none .c-label { color: var(--muted); font-weight: 500; }
  .cmp-cell.none { display: block; }
  @media (max-width: 420px) { .cmp-cell { grid-template-columns: 1fr; } .cmp-cell .c-big { font-size: 20px; } }
  .quiet.center { text-align: center; margin-top: 22px; }
  .quiet.center b { font-weight: 600; color: var(--text); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
  .banner { text-align: center; font-size: 15px; padding: 14px 18px; border-radius: 16px; background: var(--surface); margin: 0 0 18px; }
  .banner b { font-weight: 600; }
  @media (max-width: 420px) { .cmp-head, .cmp-two { gap: 10px; } }

  footer { text-align: center; font-size: 13px; color: var(--muted); padding: 72px 0 40px; }

  /* The name plays with itself: tap it and "Signal Cards" becomes "Card Signals". It also takes you home. */
  .brand { gap: .28em; } /* the space between the two words */
  .brand span { display: inline-block; transition: transform .14s ease, opacity .14s ease; }
  .brand.swap .w1 { transform: translateX(14px); opacity: 0; }
  .brand.swap .w2 { transform: translateX(-14px); opacity: 0; }

  /* On a phone, Home and All eight live in a bar at the bottom, under your thumb. On a computer they stay in the top bar. */
  .tabbar { display: none; }
  .nextpill { margin-top: 30px; padding: 0 22px; min-height: 44px; font-size: 15px; }
  @media (max-width: 699px) {
    .barnav .pill, .nextpill, .steps { display: none; } /* the bottom bar's Previous and Next do this job on a phone */
    .tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 7; display: flex; justify-content: center; gap: 10px;
              padding: 6px 12px calc(6px + env(safe-area-inset-bottom)); background: color-mix(in srgb, var(--bg) 88%, transparent);
              -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border-top: 1px solid color-mix(in srgb, var(--text) 10%, transparent); }
    .tabbar[hidden] { display: none; }
    .tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-width: min(76px, 21vw); min-height: 50px;
           background: none; border: 0; padding: 2px 8px; font-size: 11px; font-weight: 500; color: var(--muted); cursor: pointer; }
    .tab svg { width: 26px; height: 26px; color: var(--text); transition: transform .12s ease; }
    .tab:active svg { transform: scale(.86); }
    .tab.bounce svg { animation: bounce .34s ease; }
    /* On a card: Previous in the left corner, Next in the right corner, always there. Greyed at either end. */
    #tabprev { margin-right: auto; }
    #tabnext { margin-left: auto; }
    .tab { -webkit-tap-highlight-color: transparent; } /* no blue flash on tap; the bounce is the feedback */
    .tab:disabled { opacity: .28; cursor: default; }
    .tab:disabled:active svg { transform: none; }
    body.has-tabbar footer { padding-bottom: calc(96px + env(safe-area-inset-bottom)); }
  }
  @keyframes bounce { 0% { transform: scale(.86); } 45% { transform: scale(1.28) translateY(-3px); } 100% { transform: scale(1); } }
  /* On a phone, keep the header short so the tiles start high on the screen */
  @media (max-width: 699px) {
    .ask.small { padding-top: 0; }
    .ask.small { padding: 4px 0 14px; }
    .ask.small input { font-size: 16px; padding: 9px 16px; }
    .ask.small .go { font-size: 15px; padding: 9px 16px; }
    .head { padding-bottom: 20px; }
    .head h1 { font-size: 24px; margin-bottom: 4px; }
    .head p { font-size: 13px; }
    .score { margin: -8px 0 14px; font-size: 14px; gap: 2px 12px; }
    .score .ghost { min-height: 36px; }
  }
  @media (max-width: 370px) { .seg button { padding: 10px 12px; } }
  @media (prefers-reduced-motion: reduce) { .brand span { transition: none; } .tab svg { transition: none; } .tab.bounce svg { animation: none; } }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <a class="brand" href="./" id="home" aria-label="Signal Cards, home"><span class="w1">Signal</span> <span class="w2">Cards</span></a>
    <span class="barnav">
      <button class="pill" type="button" id="gohome" hidden>Home</button>
      <button class="pill" type="button" id="goall" data-card="0" hidden>All cards</button>
      <button class="iconbtn" id="gear" type="button" aria-label="Settings" aria-expanded="false" aria-controls="switches">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2.2"/><circle cx="9" cy="17" r="2.2"/></svg>
      </button>
      <button class="iconbtn" id="theme" type="button"></button>
    </span>
    <!-- Settings: set once, so they live behind the button instead of on every screen -->
    <div class="switches" id="switches" hidden>
      <p class="set-title">Wording</p>
      <div class="seg" role="group" aria-label="Wording">
        <button type="button" data-pref="lang" data-val="acct">Accounting</button><button type="button" data-pref="lang" data-val="plain">Plain English</button>
      </div>
      <p class="set-title">Last line of each card</p>
      <div class="seg" role="group" aria-label="Reader">
        <button type="button" data-pref="reader" data-val="investor">Investor</button><button type="button" data-pref="reader" data-val="cfo">CFO</button>
      </div>
      <p class="set-title">Appearance</p>
      <div class="seg" role="group" aria-label="Appearance">
        <button type="button" data-look="auto">Auto</button><button type="button" data-look="light">Light</button><button type="button" data-look="dark">Dark</button>
      </div>
      <button class="linkish" type="button" data-how>How it works</button>
    </div>
  </div>

  <!-- Shown once, the first time someone opens the app -->
  <div class="intro" id="intro" role="dialog" aria-modal="true" aria-labelledby="introtitle" hidden>
    <div class="intro-card">
      <p class="intro-step" id="introstep"></p>
      <h2 id="introtitle"></h2>
      <p class="intro-text" id="introtext"></p>
      <div class="intro-art" id="introart" aria-hidden="true"></div>
      <div class="intro-actions">
        <button class="ghost" type="button" id="introskip">Skip</button>
        <button class="go" type="button" id="intronext">Next</button>
      </div>
    </div>
  </div>

  <main>
    <section class="ask" id="ask">
      <p class="motto" id="motto">Money talks. Learn to listen.</p>
      <p class="lede">Type a company. Read its annual report, one card at a time.</p>
      <form id="form">
        <div class="box">
          <input id="q" name="q" placeholder="Company or ticker" aria-label="Company name or US ticker" autocomplete="off" spellcheck="false" maxlength="40"
                 role="combobox" aria-expanded="false" aria-controls="hits" aria-autocomplete="list">
          <ul class="hits" id="hits" role="listbox" hidden></ul>
        </div>
        <button class="go">Read</button>
      </form>
      <p class="tries" id="recent" hidden></p>
      <p class="tries" id="tryrow"><span id="trylabel">Try</span>
        <span id="picks">
          <button class="chip" type="button" data-try="AAPL">Apple</button>
          <button class="chip" type="button" data-try="COST">Costco</button>
          <button class="chip" type="button" data-try="WDFC">WD-40</button>
        </span>
        <button class="ghost shuffle" type="button" id="shuffle" aria-label="Show three other companies">↻ Shuffle</button>
      </p>
      <p class="soonline">Coming soon: Singapore Airlines, Tata · <button class="linkish" type="button" data-how>How it works</button></p>
    </section>

    <section id="overview" hidden>
      <div class="head"><h1 id="company"></h1><p class="muted" id="meta"></p><p class="headnote" id="headnote" hidden></p>
        <p class="headbtns" id="headbtns" hidden>
          <button class="pill" type="button" id="cmpbtn">Compare</button>
          <button class="pill" type="button" id="stop" hidden>Stop comparing</button>
        </p>
      </div>
      <form class="vs" id="form2" hidden>
        <label for="q2" id="vslabel">Compare with</label>
        <div class="box">
          <input id="q2" placeholder="another company" autocomplete="off" spellcheck="false" maxlength="40" role="combobox" aria-expanded="false" aria-controls="hits2" aria-autocomplete="list">
          <ul class="hits" id="hits2" role="listbox" hidden></ul>
        </div>
      </form>
      <p class="score" id="score" hidden></p>
      <div class="grid" id="grid"></div>
      <p class="quiet center" id="checkline" hidden></p>
      <p class="tries after" id="after" hidden></p>
      <div class="cmp" id="compare" hidden></div>
      <p class="key" id="key" hidden>
        <span><i class="mark good"></i>Good</span><span><i class="mark watch"></i>Watch</span><span><i class="mark warn"></i>Warning</span>
      </p>
    </section>

    <article id="detail" hidden></article>
  </main>

  <nav class="tabbar" id="tabbar" aria-label="Go to" hidden>
    <button class="tab" type="button" id="tabprev" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="m11 6-6 6 6 6"/></svg>
      Previous
    </button>
    <button class="tab" type="button" id="tabhome">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 10.5 12 3.5l8.5 7"/><path d="M5.5 9.2V19a1.5 1.5 0 0 0 1.5 1.5h2.8v-5.3h4.4v5.3H17a1.5 1.5 0 0 0 1.5-1.5V9.2"/></svg>
      Home
    </button>
    <button class="tab" type="button" id="taball" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="1.6"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.6"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.6"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.6"/></svg>
      <span id="taballlabel">All cards</span>
    </button>
    <button class="tab" type="button" id="tabnext" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>
      Next
    </button>
  </nav>

  <footer>
    <p id="source"></p>
    <p>Educational, not financial advice.</p>
  </footer>
</div>

<script>
  const $ = id => document.getElementById(id);
  // Text from the data is shown as text, never as page code.
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  // "2026-09-26" -> "26 Sep 2026"
  const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  const day = iso => { const [y, m, d] = iso.slice(0, 10).split("-"); return `${Number(d)} ${MONTHS[Number(m) - 1]} ${y}`; };
  const mark = tone => tone ? `<i class="mark ${esc(tone)}" aria-hidden="true"></i>` : "";
  const TONE = { "Most favourable": "good", "Good": "good", "Neutral / watch": "watch", "Warning": "warn", "Risk rising": "warn" };

  // "Tap" on a touch screen, "Click" with a mouse.
  const TAP = matchMedia("(hover: none)").matches ? "Tap" : "Click";
  // The data shape this page understands. Must match VERSION in sec.mjs; a test checks that it does.
  const PAGE_VERSION = 13;

  // ---------- The headline: one line for each day of the week ----------
  const MOTTOS = [
    "Just assume tomorrow is the exam.",        // Sunday
    "Money talks. Learn to listen.",            // Monday
    "Let the numbers do the talking.",          // Tuesday
    "Every company's money tells a story.",     // Wednesday
    "Follow the money.",                        // Thursday
    "The numbers don't do spin.",               // Friday
    "Read the money, not the headlines.",       // Saturday
  ];
  $("motto").textContent = MOTTOS[new Date().getDay()];

  // ---------- Home screen: three companies to try, and a Shuffle button for three more ----------
  // The pool is a few steady examples plus the big companies whose annual report landed most recently
  // (fresh numbers are the best ones to practise on). If the fresh list fails, the steady ones still work.
  const shortName = n => n.replace(/[,.]/g, "").replace(/\s+(Inc|Corp|Corporation|Co|Company|Ltd|plc|Holdings|Group|& Co|\/[A-Z]+\/?)$/gi, "").replace(/\s+(Inc|Corp|Co|& Co)$/i, "").trim();
  let pool = [{ ticker: "AAPL", label: "Apple" }, { ticker: "COST", label: "Costco" }, { ticker: "WDFC", label: "WD-40" }, { ticker: "NKE", label: "Nike" }];
  let showing = ["AAPL", "COST", "WDFC"];
  const paintPicks = (label = "Try") => {
    $("trylabel").textContent = label;
    $("picks").innerHTML = showing.map(t => pool.find(c => c.ticker === t)).map(c => {
      const when = c.filed ? day(c.filed).split(" ").slice(0, 2).join(" ") : "";
      return `<button class="chip" type="button" data-try="${esc(c.ticker)}"${c.filed ? ` title="${esc(c.name)}: annual report filed ${esc(day(c.filed))}"` : ""}>${esc(c.label)}${when ? `<span class="when">${esc(when)}</span>` : ""}</button>`;
    }).join(" ");
  };
  $("shuffle").addEventListener("click", () => { // three at random that are not on screen now
    const rest = pool.map(c => c.ticker).filter(t => !showing.includes(t));
    for (let i = rest.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [rest[i], rest[j]] = [rest[j], rest[i]]; }
    showing = rest.concat(showing).slice(0, 3);
    paintPicks();
  });
  fetch("/api/fresh").then(r => r.ok ? r.json() : null).then(d => {
    if (!d?.fresh?.length) return;
    const fresh = d.fresh.map(c => ({ ticker: c.ticker, label: shortName(c.name), name: c.name, filed: c.filed }));
    pool = fresh.concat(pool.filter(c => !fresh.some(f => f.ticker === c.ticker)));
    showing = fresh.slice(0, 3).map(c => c.ticker); // open with the three newest annual reports
    paintPicks("Just filed");
  }).catch(() => {});

  // ---------- Light and dark ----------
  // Follows the computer's setting until you press the button; then it remembers your choice.
  const root = document.documentElement;
  const isDark = () => root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  // The button shows where a tap takes you: a sun while it is dark, a moon while it is light.
  const SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/></svg>';
  const MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>';
  const paintTheme = () => {
    $("theme").innerHTML = isDark() ? SUN : MOON;
    $("theme").setAttribute("aria-label", isDark() ? "Switch to light" : "Switch to dark");
    const look = root.dataset.theme || "auto";
    document.querySelectorAll("[data-look]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.look === look)));
  };
  const setLook = look => { // "auto" follows the device; "light" and "dark" are remembered
    if (look === "auto") delete root.dataset.theme; else root.dataset.theme = look;
    try { look === "auto" ? localStorage.removeItem("theme") : localStorage.setItem("theme", look); } catch {}
    paintTheme();
  };
  try { const saved = localStorage.getItem("theme"); if (saved === "dark" || saved === "light") root.dataset.theme = saved; } catch {}
  $("theme").addEventListener("click", () => setLook(isDark() ? "light" : "dark"));
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", paintTheme);
  paintTheme();

  // ---------- Settings: behind one button in the top bar ----------
  const closeSettings = () => { $("switches").hidden = true; $("gear").setAttribute("aria-expanded", "false"); };
  $("gear").addEventListener("click", e => {
    e.stopPropagation();
    const open = $("switches").hidden;
    $("switches").hidden = !open; $("gear").setAttribute("aria-expanded", String(open));
  });
  document.addEventListener("click", e => {

  const INTRO = [

  const openIntro = () => { introAt = 0; paintIntro(); $("intro").hidden = false; closeSettings(); $("intronext").focus(); };
  const closeIntro = () => { $("intro").hidden = true; try { localStorage.setItem("sc:intro", "1"); } catch {} };

  document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("intro").hidden) closeIntro(); });
  document.addEventListener("click", e => { if (e.target.closest("[data-how]")) openIntro(); });
  // The first time, on the home screen only: someone following a link to a company should see the company.

  try { seenIntro = localStorage.getItem("sc:intro") === "1"; } catch {}
  if (!seenIntro && !new URLSearchParams(location.search).get("ticker")) openIntro();

  const recents = () => { try { const r = JSON.parse(localStorage.getItem("sc:recent")); return Array.isArray(r) ? r.filter(c => c && c.ticker && c.label) : []; } catch { return []; } };
  const remember = d => {
    const list = [{ ticker: d.ticker, label: shortName(d.company) }, ...recents().filter(c => c.ticker !== d.ticker)].slice(0, 6);

  };
  // Once you have read a company, "Recent" stands where the suggestions were; one link brings them back.

  paintRecent();

  // ---------- What this browser remembers ----------
  // Your guesses and your "checked" ticks, per company and fiscal year. Kept in this browser only.
  const mem = {};
  const store = {
    get(k) { try { return JSON.parse(localStorage.getItem(k)) ?? mem[k] ?? {}; } catch { return mem[k] ?? {}; } },
    set(k, v) { mem[k] = v; try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  };
  const keyFor = (kind, d) => `sc:${kind}:${d.ticker}:${d.fiscal.this_year.end}`;
  // Guesses last for one sitting: they are forgotten when you close the tab, and when a new day starts.
  // So the cards are face down again each time you come back. Ticks and switches are kept for good.
  const sitting = {
    get(k) { try { return JSON.parse(sessionStorage.getItem(k)) ?? mem[k] ?? {}; } catch { return mem[k] ?? {}; } },
    set(k, v) { mem[k] = v; try { sessionStorage.setItem(k, JSON.stringify(v)); } catch {} },
  };
  const today = () => new Date().toDateString();
  const guesses = d => { const g = sitting.get(keyFor("guess", d)); return g._day === today() ? g : {}; }; // { "3": "warn" }, or "skip" if revealed without guessing
  const setGuesses = (d, g) => sitting.set(keyFor("guess", d), { ...g, _day: today() });
  try { Object.keys(localStorage).filter(k => k.startsWith("sc:guess:")).forEach(k => localStorage.removeItem(k)); } catch {} // guesses from before this change

  const TONES = { good: "Good", watch: "Watch", warn: "Warning" };
  const canGuess = c => !!c.tone;                        // cards with no label have nothing to guess
  const faceDown = (d, n) => canGuess(d.cards[n - 1]) && !guesses(d)[n];

  // ---------- The two switches ----------
  // Wording: accounting terms or plain English. Reader: investor or CFO (same cards, different last line).
  const prefs = { lang: "acct", reader: "investor", ...store.get("sc:prefs") };
  const plain = () => prefs.lang === "plain";
  const W = (o, k) => (plain() && o[k + "_plain"]) || o[k];          // W(card, "signal") -> the name in the chosen wording
  const READER = { investor: "Investor · verify next", cfo: "CFO · ask inside" };
  if (!READER[prefs.reader]) prefs.reader = prefs.reader === "coo" ? "cfo" : "investor"; // the second reader used to be the COO
  const paintPrefs = () => document.querySelectorAll("[data-pref]").forEach(b => b.setAttribute("aria-pressed", String(prefs[b.dataset.pref] === b.dataset.val)));
  paintPrefs();

  // ---------- What the address bar says ----------
  // ?ticker=AAPL shows the eight tiles. ?ticker=AAPL&card=3 shows card 3 on its own screen.
  // ?ticker=AAPL&vs=COST shows the two companies side by side.
  let data = null;     // the company currently loaded
  let other = null;    // the company it is being compared with, if any
  let justFlipped = 0; // the card that was just guessed, so its reveal plays once
  let tileToFlip = 0;  // the same card's tile, so it turns over once when you go back to the eight
  let slide = "";      // "next" or "prev" while moving from one card to another, so the new one slides in
  let picking = false; // true for the short beat between tapping a guess and the card turning
  const loaded = {};   // companies already fetched in this visit
  const where = () => {
    const q = new URLSearchParams(location.search);
    const n = Number(q.get("card"));
    const ticker = (q.get("ticker") || "").trim().toUpperCase(), vs = (q.get("vs") || "").trim().toUpperCase();
    const whole = v => { const x = Number(q.get(v)); return Number.isInteger(x) && x >= 1 && x <= 40 ? x : 0; };
    // after=8 is the checkpoint shown after card 8, before the next group of cards. It takes the place of a card.
    const after = whole("after");
    return { ticker, card: after ? 0 : (Number.isInteger(n) && n >= 1 && n <= 40 ? n : 0), after, vs: vs && vs !== ticker ? vs : "" };
  };
  // vs left out: keep the comparison while you stay on the same company, drop it when you pick a new one.
  const go = (ticker, card = 0, vs, after = 0) => {
    const now = where();
    if (vs === undefined) vs = ticker && ticker === now.ticker ? now.vs : "";
    const spot = (c, a) => c || (a ? a + 0.5 : 0); // a checkpoint sits between two cards
    const [from, to] = [spot(now.card, now.after), spot(card, after)];
    slide = from && to && ticker === now.ticker && from !== to ? (to > from ? "next" : "prev") : "";
    history.pushState(null, "", ticker ? `?ticker=${encodeURIComponent(ticker)}${card ? `&card=${card}` : ""}${after ? `&after=${after}` : ""}${vs ? `&vs=${encodeURIComponent(vs)}` : ""}` : "./");
    render();
    scrollTo(0, 0);
  };
  // The cards worth stepping through: the ones with numbers to show. A card with nothing to show
  // ("Not found", "Doesn't apply") is left out of Next and Previous, and listed quietly on the tiles screen.
  const live = d => d.cards.map((c, i) => i + 1).filter(n => d.cards[n - 1].rows.length);
  // Next and Previous, from wherever you are. Moving on from the last card of a group stops at a
  // checkpoint first, and moving on from the very last card goes to the end screen.
  const forward = () => {
    const { ticker, card, after } = where();
    if (!data) return;
    const from = after || card, nextN = live(data).find(n => n > from);
    if (!from) return;
    if (after) return nextN ? go(ticker, nextN) : undefined;          // the end screen has nothing after it
    if (!nextN || data.cards[nextN - 1].deck !== data.cards[card - 1].deck) return go(ticker, 0, undefined, card);
    go(ticker, nextN);
  };
  const back = () => {
    const { ticker, card, after } = where();
    if (!data) return;

    if (prevN) go(ticker, prevN);
  };
  // Which folded sections of a card you have opened. Kept for this sitting, so it carries from card to card.
  // On a wide screen "The numbers" starts open; on a phone everything starts folded.
  let folds = null;
  try { folds = JSON.parse(sessionStorage.getItem("sc:folds")); } catch {}
  if (!folds || typeof folds !== "object") folds = { numbers: matchMedia("(min-width: 700px)").matches };
  const isOpen = key => !!folds[key];
  const fail = (title, why) => {
    data = other = null;
    $("detail").hidden = true; $("ask").hidden = false; $("overview").hidden = false;
    $("grid").innerHTML = ""; $("grid").hidden = false; $("compare").hidden = true; $("key").hidden = true; $("score").hidden = true; $("after").hidden = true; $("checkline").hidden = true;
    $("form2").hidden = true; $("headbtns").hidden = true; $("source").textContent = "";
    $("company").textContent = title; $("meta").textContent = why; $("headnote").hidden = true;
  };
  // While a company is being fetched: its name, and grey placeholder tiles where the cards will be.

  };
  let cmpOpen = false; // whether the "Compare with" box is showing
  async function load(ticker) {

    if (d.version > PAGE_VERSION) {

    }

  // One tile. Face down it shows only the two numbers.

      <button class="tile${c.label ? "" : " empty"}${down ? " down" : c.tone ? " tone-" + esc(c.tone) : ""}${d === data && n === tileToFlip ? " flipped" : ""}" type="button" data-card="${n}" data-ticker="${esc(d.ticker)}">

  async function render() {

    document.title = `${d.ticker} · Signal Cards`;

  function drawCompare(a, b) {

  // The score line above the tiles.

    const caught = tried.filter(n => g[n] === d.cards[n - 1].tone).length;

    const tally = tried.length ? `<b>${caught} of ${tried.length} caught.</b>` : "";

  }

  function drawCheckpoint(d, n) {

    const nums = d.cards.map((c, i) => i + 1).filter(k => (end || d.cards[k - 1].deck === done.deck) && canGuess(d.cards[k - 1]));
    const left = nums.filter(k => !g[k]).length;

      : left ? `${left} still face down. You can go back and guess them.` : nums.length ? "All revealed." : "";
    // What the revealed cards said, by mark. Face-down cards are left out so nothing is given away.
    const shown = nums.filter(k => g[k]).map(k => d.cards[k - 1].tone);
    const tally = Object.entries(TONES).map(([t, word]) => [t, word, shown.filter(x => x === t).length]).filter(x => x[2])
      .map(([t, word, count]) => `<span>${mark(t)}${count} ${word.toLowerCase()}</span>`).join("");
    document.title = `${end ? "Finished" : done.deck} · ${d.ticker} · Signal Cards`;
    $("tabprev").disabled = false; $("tabnext").disabled = end;
    $("detail").classList.remove("fresh", "slide-next", "slide-prev");
    if (slide) { void $("detail").offsetWidth; $("detail").classList.add(`slide-${slide}`); slide = ""; }
    // On the end screen: three other companies to read next.
    const others = end ? pool.filter(c => c.ticker !== d.ticker).sort(() => Math.random() - .5).slice(0, 3) : [];
    $("detail").innerHTML = `
      <div class="nav"><span class="muted">${end ? "Finished" : `${esc(done.deck)} · done`}</span></div>
      <div class="hero checkpoint">
        <p class="kicker">${esc(d.company)} · ${esc(T.fy)} vs ${esc(L.fy)}</p>
        <p class="cp-title">${end ? "That's every card." : `That's ${esc(done.deck.charAt(0).toLowerCase() + done.deck.slice(1))}.`}</p>
        ${score ? `<p class="cp-score">${esc(score)}</p>` : ""}
        ${tally ? `<p class="cp-tally">${tally}</p>` : ""}
        ${end ? (others.length ? `<p class="cp-next"><small>Read another</small></p><p class="tries cp-tries">${others.map(c => `<button class="chip" type="button" data-try="${esc(c.ticker)}">${esc(c.label)}</button>`).join(" ")}</p>` : "")
              : `<p class="cp-next"><small>Next</small>${esc(next.deck)}. ${esc(DECK_BLURB[next.deck] ?? "")}</p>`}
        <div class="cp-actions">
          ${end ? "" : `<button class="go" type="button" data-forward>Go on to ${esc(next.deck)} →</button>`}
          <button class="${end ? "go" : "pill"}" type="button" data-card="0">Back to all cards</button>
        </div>
      </div>`;
  }

  // A number that links to its place in the filing, when we know where that is.
  const inFiling = (shown, link) => link ? `<a class="chk" href="${esc(link)}" target="_blank" rel="noopener" title="Open the filing at this number">${esc(shown)}</a>` : esc(shown);

  function drawCard(d, n) {
    if (n > d.cards.length) return go(d.ticker, 0); // a link to a card this company does not have
    const c = d.cards[n - 1], T = d.fiscal.this_year, L = d.fiscal.last_year;
    const steppable = live(d), place = steppable.indexOf(n);
    const prevN = [...steppable].reverse().find(k => k < n), nextN = steppable.find(k => k > n);
    $("tabprev").disabled = !prevN;                 // greyed on the first card
    $("tabnext").disabled = false;                  // after the last card, Next goes to the end screen
    // A section of proof that stays folded until you tap it. Which ones you leave open is remembered.
    const fold = (key, title, body) => `
      <details class="fold" data-fold="${key}"${isOpen(key) ? " open" : ""}>
        <summary><span>${esc(title)}</span></summary>
        <div class="fold-body">${body}</div>
      </details>`;
    // What an analyst would quote: one or two ratios beside the growth rate.
    const ratios = c.ratios?.length ? fold("ratios", "What an analyst would quote", `
        <div class="scroll"><table class="stack">
          <tr><th>Ratio</th><th class="num">${esc(T.fy)}</th><th class="num">${esc(L.fy)}</th><th>Formula and result</th></tr>
          ${c.ratios.map(r => `<tr><td>${esc(W(r, "name"))}</td><td class="num">${esc(r.this_year)}</td><td class="num">${esc(r.last_year)}</td><td class="f">${r.formula.map(esc).join("<br>")}</td></tr>`).join("")}
        </table></div>
        ${c.ratios.map(r => `<p class="reading">${esc(r.reading)}</p>`).join("")}
        <p class="note muted">These use the year-end figures as printed. Analysts often average the start and end of the year, which gives slightly different numbers.</p>`) : "";
    // How the label was decided: the rule table, with the row that applied marked.
    const rule = c.rule && c.label ? fold("rule", "How this label is decided", `
        <div class="scroll"><table class="rules">
          <tr><th>When</th><th>Label</th></tr>
          ${c.rule.rows.map(([when, name], i) => `<tr${i === c.rule.hit ? ' class="hit"' : ""}><td>${esc(when)}${i === c.rule.hit ? ' <span class="thisone">this card</span>' : ""}</td><td class="lab">${mark(TONE[name])}${esc(name)}</td></tr>`).join("")}
        </table></div>
        <p class="note muted">The first row that fits, reading down, gives the label. A label is a first screen, not a verdict.</p>`) : "";
    const prev = d.cards[prevN - 1], next = d.cards[nextN - 1];
    document.title = `${c.signal} · ${d.ticker} · Signal Cards`;
    const rows = c.rows.map(r => `
      <tr>
        <td>${esc(W(r, "item"))}</td>
        <td class="num">${inFiling(r.this_year, r.this_link)}</td>
        <td class="num">${inFiling(r.last_year, r.last_link)}</td>
        <td class="f">${r.formula.map(esc).join("<br>")}</td>
        <td class="src">${r.url ? `<a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.statement)}</a>` : esc(r.statement)}</td>
      </tr>`).join("");
    // The trend table: the last column is a label, the rest are numbers.
    const trend = c.trend ? fold("trend", `The last ${c.trend.rows.length} years`, `
        <div class="scroll"><table>
          <tr>${W(c.trend, "columns").map((h, i, all) => `<th${i > 0 && i < all.length - 1 ? ' class="num"' : ""}>${esc(h)}</th>`).join("")}</tr>
          ${c.trend.rows.map(r => `<tr>${r.map((v, i) => i === 0 ? `<td>${esc(v)}</td>` : i === r.length - 1 ? `<td class="lab">${mark(TONE[v])}${esc(v)}</td>` : `<td class="num">${esc(v)}</td>`).join("")}</tr>`).join("")}
        </table></div>
        <p class="note muted">Each row compares that year with the year before, by the same rules. One year can mislead; a run of years is harder to argue with.</p>`) : "";
    const down = faceDown(d, n), said = guesses(d)[n], checked = !!checks(d)[n];
    const verdict = !canGuess(c) || !said || said === "skip" ? "" : said === c.tone ? "You caught it." : `You said ${TONES[said]}. Missed this one.`;
    const missed = canGuess(c) && said && said !== "skip" && said !== c.tone; // a wrong guess: show the rule that applied
    const nextLabel = !next ? "Finish" : next.deck !== c.deck ? next.deck : W(next, "signal"); // where Next leads
    const steps = `
      <div class="steps">
        ${prev ? `<button type="button" data-card="${prevN}"><small>Previous</small>← ${esc(W(prev, "signal"))}</button>` : ""}
        <button type="button" data-forward><small>Next</small>${esc(nextLabel)} →</button>
      </div>`;
    // Progress: one dot for each card you can step through, coloured once it is revealed.
    const dots = steppable.map((k, i) => {
      const cc = d.cards[k - 1], look = k === n ? " here" : "";
      const state = !canGuess(cc) ? "none" : faceDown(d, k) ? "down" : cc.tone;
      const gap = i && cc.deck !== d.cards[steppable[i - 1] - 1].deck ? '<i class="dotgap"></i>' : "";
      return `${gap}<button class="dot ${state}${look}" type="button" data-card="${k}" aria-label="${esc(W(cc, "signal"))}"${k === n ? ' aria-current="true"' : ""}></button>`;
    }).join("");
    const top = `
      <div class="nav">
        ${place >= 0 ? `<div class="dots" role="group" aria-label="Cards">${dots}</div>` : ""}
        <span class="muted">${esc(c.deck ?? "")}${place >= 0 ? ` · ${place + 1} of ${steppable.length}` : ""}</span>
      </div>
      ${swiped ? "" : `<p class="swipe-hint">‹ Swipe left or right for the next card ›</p>`}`;
    const numbers = `
        <p class="kicker">${c.caption ? "" : `${esc(W(c, "signal"))} · `}${esc(d.company)} · ${esc(T.fy)} vs ${esc(L.fy)}</p>
        ${c.caption ? `<p class="cap">${esc(W(c, "caption"))}</p>` : ""}
        <p class="big">${esc(c.big)}</p>
        <p class="under">${c.measure ? `${esc(c.measure)} · ` : ""}${esc(c.small)}</p>`;
    $("detail").classList.toggle("fresh", !down && n === justFlipped); // play the reveal once, right after a guess
    $("detail").classList.remove("slide-next", "slide-prev");
    if (slide) { void $("detail").offsetWidth; $("detail").classList.add(`slide-${slide}`); slide = ""; } // restart the slide each time
    if (down) { // face down: the two numbers and the question, nothing that gives the answer away
      $("detail").innerHTML = `${top}
      <div class="hero">${numbers}
        <p class="ask-flag">Good, watch or warning?</p>
        <div class="guess">${Object.entries(TONES).map(([t, word]) => `<button type="button" data-guess="${t}">${mark(t)}${word}</button>`).join("")}</div>
        <p class="what">${esc(c.what)}</p>
      </div>${place >= 0 ? steps : ""}`;
      return;
    }
    $("detail").innerHTML = `${top}
      <div class="hero">${numbers}
        <div class="reveal${!said || said === "skip" || !canGuess(c) ? "" : said === c.tone ? " hit" : " miss"}">
          <p class="verdict">${esc(verdict)}</p>
          <p class="name">${mark(c.tone)}${esc(c.label ? c.label.name : c.state)}</p>
          <p class="line${c.label ? "" : " plain"}">${esc(c.label ? (plain() ? c.label.plain : c.label.reason) : c.note)}</p>
          ${missed && c.rule?.hit >= 0 ? `<p class="why"><small>Why it is ${esc(c.label.name)}</small>${esc(c.rule.rows[c.rule.hit][0].replace(/the item/g, W(c, "signal").toLowerCase()))}.</p>` : ""}
          ${c.next ? `<p class="next"><small>${READER[prefs.reader]}</small>${esc(c.next[prefs.reader])}</p>` : ""}
          ${place >= 0 ? `<button class="pill nextpill" type="button" data-forward>${next ? "Next: " : ""}${esc(nextLabel)} →</button>` : ""}
        </div>
        <p class="what">${esc(c.what)}</p>
      </div>
      ${c.rows.length ? `
      <div class="folds">
      ${fold("numbers", `The numbers${checked ? " · checked" : ""}`, `
        <p class="unit muted">In ${esc(d.unit)}, as printed in the filing.</p>
        <div class="scroll"><table class="stack">
          <tr><th>Item</th><th class="num">${esc(T.fy)}</th><th class="num">${esc(L.fy)}</th><th>Formula and result</th><th>Source</th></tr>
          ${rows}
        </table></div>
        <label class="tick"><input type="checkbox" id="checked"${checked ? " checked" : ""}> <span><b>${checked ? "Checked" : "Draft"}.</b> I checked these numbers in the <a href="${esc(d.filing.url)}" target="_blank" rel="noopener">filing</a> myself.</span></label>
        <p class="note muted">${c.rows.some(r => r.this_link) ? `${TAP} a number to open the filing at that number, highlighted.` : ""}</p>`)}${ratios}${trend}${rule}
      </div>` : ""}${place >= 0 ? steps : ""}`;
    justFlipped = 0;
  }

  // ---------- Search: type a name or a ticker, pick from the list ----------
  // Used twice: the main box, and the "Compare with" box.
  async function find(text) {
    const r = await fetch(`/api/search?q=${encodeURIComponent(text)}`);
    const d = await r.json();
    if (!r.ok) throw new Error(d.error);
    return d.results;
  }
  function searchBox(input, list, form, onPick, onMiss) {
    let hits = [], picked = -1, asked = 0, timer;
    const close = () => { hits = []; picked = -1; list.hidden = true; input.setAttribute("aria-expanded", "false"); };
    const paint = () => {
      list.hidden = !hits.length; input.setAttribute("aria-expanded", String(!!hits.length));
      list.innerHTML = hits.map((h, i) => `<li role="option" id="${list.id}-${i}" data-i="${i}" aria-selected="${i === picked}"><span class="n">${esc(h.name)}${h.aka ? ` <span class="aka">${esc(h.aka)}</span>` : ""}</span><span class="t">${esc(h.ticker)}</span></li>`).join("");
      if (picked >= 0) input.setAttribute("aria-activedescendant", `${list.id}-${picked}`); else input.removeAttribute("aria-activedescendant");
    };
    const choose = h => { close(); input.blur(); onPick(h.ticker); };
    input.addEventListener("input", () => {
      clearTimeout(timer);
      const text = input.value.trim(), mine = ++asked;
      if (!text) return close();
      timer = setTimeout(async () => {
        try { const found = await find(text); if (mine === asked) { hits = found; picked = -1; paint(); } } catch { if (mine === asked) close(); }
      }, 140);
    });
    input.addEventListener("keydown", e => {
      if (e.key === "Escape") return close();
      if (!hits.length || (e.key !== "ArrowDown" && e.key !== "ArrowUp")) return;
      e.preventDefault();
      picked = (picked + (e.key === "ArrowDown" ? 1 : -1) + hits.length + (picked < 0 && e.key === "ArrowUp" ? 1 : 0)) % hits.length;
      paint();
    });
    input.addEventListener("focus", () => input.select());
    input.addEventListener("blur", () => setTimeout(close, 150));
    list.addEventListener("mousedown", e => { const li = e.target.closest("li"); if (li) { e.preventDefault(); choose(hits[Number(li.dataset.i)]); } });
    form.addEventListener("submit", async e => {
      e.preventDefault();
      clearTimeout(timer); asked++;
      const text = input.value.trim();
      if (!text) return;
      if (picked >= 0 && hits[picked]) return choose(hits[picked]);
      close();
      try {
        const found = await find(text);               // best match first: an exact ticker wins
        if (found.length) choose(found[0]); else onMiss(text);
      } catch (err) { fail("Nothing to read.", err.message || "Something went wrong. Is the server still running in the Terminal?"); }
    });
  }
  const noMatch = text => `No US-listed company matches "${text}". Check the spelling, or try its ticker.`;
  searchBox($("q"), $("hits"), $("form"), t => go(t),
    text => { history.pushState(null, "", "./"); $("ask").classList.remove("small"); fail("Nothing to read.", noMatch(text)); });
  searchBox($("q2"), $("hits2"), $("form2"), t => { if (data && t !== data.ticker) { cmpOpen = false; go(data.ticker, 0, t); } },
    text => { $("q2").value = ""; $("q2").placeholder = "no match, try again"; });
  $("stop").addEventListener("click", () => { cmpOpen = false; if (data) go(data.ticker, 0, ""); });
  // The Compare button under the company's name opens the box, and puts the cursor in it.
  $("cmpbtn").addEventListener("click", () => {
    cmpOpen = !cmpOpen;
    $("form2").hidden = !cmpOpen;
    if (cmpOpen) { $("q2").placeholder = "another company"; $("q2").focus(); }
  });

  // ---------- Clicks and keys ----------
  // Tapping the name swaps its two words, for fun, and takes you home.
  let swapped = false;
  $("home").addEventListener("click", e => {
    e.preventDefault();
    const el = $("home");
    el.classList.add("swap");
    setTimeout(() => { swapped = !swapped; el.querySelector(".w1").textContent = swapped ? "Card" : "Signal"; el.querySelector(".w2").textContent = swapped ? "Signals" : "Cards"; el.classList.remove("swap"); }, 150);
    if (where().ticker) go("");
    $("q").focus();
  });
  $("gohome").addEventListener("click", () => go(""));
  // The bottom bar on phones: the icon bounces, then you go. Without motion, you just go.
  const still = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
  const press = (btn, then) => {
    if (still()) return then();
    btn.classList.remove("bounce"); void btn.offsetWidth; btn.classList.add("bounce");
    setTimeout(() => { btn.classList.remove("bounce"); then(); }, 200);
  };
  $("tabhome").addEventListener("click", e => press(e.currentTarget, () => go("")));
  $("taball").addEventListener("click", e => press(e.currentTarget, () => { if (data && where().card) go(data.ticker, 0); }));
  $("tabnext").addEventListener("click", e => press(e.currentTarget, forward));
  $("tabprev").addEventListener("click", e => press(e.currentTarget, back));
  document.addEventListener("click", e => {
    const t = e.target.closest("[data-try]");
    if (t) return go(t.dataset.try);
    if (!data) return;
    const { card } = where();
    const guess = e.target.closest("[data-guess]");
    if (guess && card) { // a guess on a card screen: light up the pick, then remember it and turn the card
      if (picking) return;
      const d = data, commit = () => {
        picking = false;
        setGuesses(d, { ...guesses(d), [card]: guess.dataset.guess });
        justFlipped = tileToFlip = card; render();
      };
      const box = guess.closest(".guess");
      if (!box || matchMedia("(prefers-reduced-motion: reduce)").matches) return commit();
      picking = true; box.classList.add("chosen"); guess.classList.add("picked");
      return setTimeout(commit, 340);
    }
    if (e.target.closest("#reveal")) { // flip everything that is still face down, without scoring it
      const g = { ...guesses(data) };
      data.cards.forEach((c, i) => { if (canGuess(c) && !g[i + 1]) g[i + 1] = "skip"; });
      setGuesses(data, g); return render();
    }
    if (e.target.closest("#again")) { setGuesses(data, {}); return render(); }
    if (e.target.closest("[data-forward]")) return forward(); // a Next button on a card or a checkpoint
    const b = e.target.closest("[data-card]");
    if (!b) return;
    const owner = b.dataset.ticker || data.ticker; // in a comparison, a tile may belong to the other company
    go(owner, Number(b.dataset.card), owner !== data.ticker ? data.ticker : undefined);
  });
  document.addEventListener("click", e => {
    const b = e.target.closest("[data-pref]");
    if (!b) return;
    prefs[b.dataset.pref] = b.dataset.val;
    store.set("sc:prefs", prefs); paintPrefs(); render();
  });
  // Remember which folded sections are open, so they stay that way on the next card.
  $("detail").addEventListener("toggle", e => {
    const key = e.target.dataset?.fold;
    if (!key) return;
    folds[key] = e.target.open;
    try { sessionStorage.setItem("sc:folds", JSON.stringify(folds)); } catch {}
  }, true);
  document.addEventListener("change", e => {
    if (e.target.id !== "checked" || !data) return;
    const { card } = where();
    store.set(keyFor("checked", data), { ...checks(data), [card]: e.target.checked });
    render();
  });
  document.addEventListener("keydown", e => {
    const { ticker, card, after } = where();
    if ((!card && !after) || !data || e.target.matches("input")) return;
    if (e.key === "Escape") go(ticker);
    if (e.key === "ArrowLeft") back();
    if (e.key === "ArrowRight") forward();
  });
  // Swipe left or right on a card to go to the next or previous one. Tables that scroll sideways are left alone.
  let sx = 0, sy = 0, swiping = false;
  let swiped = false; // once you have swiped, the hint has done its job and goes away for good
  try { swiped = localStorage.getItem("sc:swiped") === "1"; } catch {}
  $("detail").addEventListener("touchstart", e => {
    swiping = e.touches.length === 1 && !e.target.closest(".scroll, input");
    sx = e.touches[0].clientX; sy = e.touches[0].clientY;
  }, { passive: true });
  $("detail").addEventListener("touchend", e => {
    if (!swiping || !data || picking) return;
    swiping = false;
    const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.5) return; // too short, or really a scroll
    const { card, after } = where();
    if (!card && !after) return;
    if (!swiped) { swiped = true; try { localStorage.setItem("sc:swiped", "1"); } catch {} }
    const here = location.search;
    if (dx < 0) forward(); else back();
    if (location.search === here) render(); // at either end: nothing to move to, but the hint can go
  }, { passive: true });
  addEventListener("popstate", render);
  render();
</script>
</body>
</html>
